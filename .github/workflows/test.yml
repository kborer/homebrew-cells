name: Formula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula:
    name: Homebrew / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Add Linux Homebrew to PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install from the reviewed local tap
        run: |
          brew tap kborer/cells "$GITHUB_WORKSPACE"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula kborer/cells/terminal-cells
          fi
          brew install --build-from-source kborer/cells/terminal-cells
      - run: brew test kborer/cells/terminal-cells
      - run: brew audit --strict kborer/cells/terminal-cells
      - name: Verify the manual and remove the package
        run: |
          test -f "$(brew --prefix terminal-cells)/share/man/man1/cells.1"
          brew uninstall terminal-cells
          hash -r
          test ! -e "$(brew --prefix)/bin/cells"
